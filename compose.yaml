services:
  buildroot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "24.04"
    image: allwinner-a333-buildroot:2025.02.16
    working_dir: /workspace
    environment:
      BUILD_UID: "${BUILD_UID:-1000}"
      BUILD_GID: "${BUILD_GID:-1000}"
      BR2_DL_DIR: /workspace/dl
    volumes:
      - .:/workspace
    init: true
    stdin_open: true
    tty: true
