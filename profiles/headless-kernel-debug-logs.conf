#!/usr/bin/env bash
# Same product/overlays and OTA compatibility, verbose kernel diagnostics.
source "$(dirname -- "${BASH_SOURCE[0]}")/headless.conf"
DEFCONFIG=a333_headless_kernel_debug_logs_defconfig
KERNEL_LOGGING=debug
OUTPUT_DIR=output/profiles/headless-kernel-debug-logs
A333_RAUC_BUNDLE_NAME=a333-headless-kernel-debug-logs.raucb
