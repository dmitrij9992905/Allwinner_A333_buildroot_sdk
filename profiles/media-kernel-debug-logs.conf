#!/usr/bin/env bash
# Same product/overlays and OTA compatibility, verbose kernel diagnostics.
source "$(dirname -- "${BASH_SOURCE[0]}")/media.conf"
DEFCONFIG=a333_media_kernel_debug_logs_defconfig
KERNEL_LOGGING=debug
OUTPUT_DIR=output/profiles/media-kernel-debug-logs
A333_RAUC_BUNDLE_NAME=a333-media-kernel-debug-logs.raucb
