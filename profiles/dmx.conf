# Existing tablet with 1280x800 MIPI display and DMX panel.
DEFCONFIG=a333_helperboard_defconfig
KERNEL_LOGGING=quiet
OUTPUT_DIR=output/profiles/dmx
A333_RAUC_BUNDLE_NAME=a333-dmx.raucb
ROOTFS_OVERLAYS=(
    overlays/a333/rootfs
    overlays/components/display/rootfs
    overlays/components/dmx/rootfs
)
OEM_OVERLAYS=(oem/a333/common-rootfs oem/a333/rootfs)
