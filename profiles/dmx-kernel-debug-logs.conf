#!/usr/bin/env bash
# Same product/overlays and OTA compatibility, verbose kernel diagnostics.
source "$(dirname -- "${BASH_SOURCE[0]}")/dmx.conf"
DEFCONFIG=a333_dmx_kernel_debug_logs_defconfig
KERNEL_LOGGING=debug
OUTPUT_DIR=output/profiles/dmx-kernel-debug-logs
A333_RAUC_BUNDLE_NAME=a333-dmx-kernel-debug-logs.raucb
