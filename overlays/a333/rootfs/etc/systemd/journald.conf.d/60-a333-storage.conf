[Journal]
Storage=persistent
Compress=yes
# Bound flash consumption; journald rotates/vacuums archived journals itself.
SystemMaxUse=64M
SystemKeepFree=128M
SystemMaxFileSize=8M
SystemMaxFiles=16
RuntimeMaxUse=8M
RuntimeMaxFileSize=2M
RuntimeMaxFiles=8
MaxFileSec=1day
MaxRetentionSec=7day
RateLimitIntervalSec=30s
RateLimitBurst=1000
SyncIntervalSec=5min
