music_directory "/userdata/media/music"
playlist_directory "/userdata/media/playlists"
db_file "/userdata/var/lib/mpd/database"
state_file "/userdata/var/lib/mpd/state"
sticker_file "/userdata/var/lib/mpd/sticker.sql"
bind_to_address "127.0.0.1"
port "6600"
auto_update "yes"
audio_output {
    type "alsa"
    name "A333 audio"
    device "default"
    # Stable hardware rate; MPD resamples other source rates.
    format "48000:16:2"
    mixer_type "software"
}
