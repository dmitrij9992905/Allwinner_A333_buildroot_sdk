# One fixed-rate hardware stream shared by MPD and Bluetooth playback.
# plug converts incoming rates/formats; dmix avoids exclusive-device conflicts.
pcm.a333_mixer {
    type dmix
    ipc_key 333048
    ipc_key_add_uid true
    slave {
        pcm "hw:0,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.a333_playback {
    type plug
    slave.pcm "a333_mixer"
}
pcm.!default {
    type asym
    playback.pcm "a333_playback"
    capture.pcm "plughw:0,0"
}
ctl.!default {
    type hw
    card 0
}
