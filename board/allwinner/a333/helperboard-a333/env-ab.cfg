# Buildroot/Linux A/B environment for the Allwinner sunxi switcher.
# Keep this file as the source of the default U-Boot environment; it is not an
# Android misc/boot-control block.

earlyprintk=sunxi-uart,0x02b00000
initcall_debug=0
console=ttyS0,115200
nand_root=ubi0_4
mmc_root=/dev/mmcblk0p6
nor_root=/dev/mtdblock1
init=/sbin/init
loglevel=3
coherent_pool=16M
mac=
wifi_mac=
bt_mac=
specialstr=
rootfstype=ext4

# The vendor switcher changes these values before boot.
systemA=bootA
systemB=bootB
rootfsA=rootfsA
rootfsB=rootfsB
rootdevA=/dev/mmcblk0p6
rootdevB=/dev/mmcblk0p7
systemAB_next=A
systemAB_now=A
systemAB_damage=A
boot_partition=bootA
root_partition=rootfsA
bootcount=0
bootlimit=3

setargs_nand=setenv bootargs earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} ubi.mtd=sys root=${nand_root} rootfstype=ubifs rootwait init=${init} partitions=${partitions} cma=${cma} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr}
setargs_nand_ubi=setenv bootargs ubi.mtd=sys earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nand_root} rootfstype=ubifs init=${init} partitions=${partitions} cma=${cma} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr}
setargs_mmc=setenv bootargs earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${mmc_root} rootfstype=${rootfstype} rootwait init=${init} partitions=${partitions} cma=${cma} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr} rauc.slot=${systemAB_now}

# Unlike the vendor single-slot command, read the partition selected by the
# Allwinner switcher. The image itself remains the vendor Android boot format.
boot_normal=sunxi_flash read 44800000 ${boot_partition};bootm 44800000
boot_fastboot=fastboot

# Bootcount fallback. The C switcher performs the normal selection during
# board_late_init; this command moves to the other slot after bootlimit.
ab_failover=if test "${systemAB_next}" = "A"; then setenv systemAB_next B; setenv systemAB_damage A; setenv systemAB_now B; setenv boot_partition ${systemB}; setenv root_partition ${rootfsB}; setenv mmc_root ${rootdevB}; else setenv systemAB_next A; setenv systemAB_damage B; setenv systemAB_now A; setenv boot_partition ${systemA}; setenv root_partition ${rootfsA}; setenv mmc_root ${rootdevA}; fi; setenv bootcount 0; saveenv; run setargs_mmc boot_normal
altbootcmd=run ab_failover
bootdelay=0
bootcmd=run setargs_nand boot_normal
